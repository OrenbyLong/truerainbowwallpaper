  <style>
    :root {
      --hue-shift: 0deg;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      background-color: #0f172a;
      color: #ffffff;
    }

    .font-display {
      font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
    }

    /* Dynamic shifting color aura & background canvas */
    @keyframes rainbowCycle {
      0% { filter: hue-rotate(0deg) saturate(1.18) brightness(0.96); }
      50% { filter: hue-rotate(28deg) saturate(1.32) brightness(1.02); }
      100% { filter: hue-rotate(0deg) saturate(1.18) brightness(0.96); }
    }

    .dynamic-bg-layer {
      animation: rainbowCycle 16s ease-in-out infinite;
      will-change: transform, filter;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Floating colorful orbs for vibrant dynamic ambiance */
    @keyframes floatOrbA {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(45px, -35px) scale(1.12); }
      66% { transform: translate(-30px, 30px) scale(0.94); }
    }

    @keyframes floatOrbB {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-55px, -40px) scale(1.16); }
    }

    @keyframes shimmerBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb-a {
      animation: floatOrbA 12s ease-in-out infinite;
    }

    .orb-b {
      animation: floatOrbB 15s ease-in-out infinite;
    }

    .rainbow-border {
      background: linear-gradient(120deg, #ff4d8d, #ffbe0b, #00f5d4, #4cc9f0, #b5179e, #ff4d8d);
      background-size: 300% 300%;
      animation: shimmerBorder 6s ease infinite;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .glass-card:hover {
      transform: translateY(-8px) scale(1.015);
      box-shadow: 0 24px 48px -12px rgba(255, 77, 141, 0.35), 0 12px 24px -8px rgba(76, 201, 240, 0.25);
      border-color: rgba(255, 255, 255, 0.42);
    }

    .wallpaper-img {
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s ease;
    }

    .glass-card:hover .wallpaper-img {
      transform: scale(1.07);
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.7);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ff4d8d, #4cc9f0);
      border-radius: 9999px;
    }
  </style>
</head>

          vi: "Gió Nắng Vương Quốc Vàng",
          en: "Sunny Kingdom Breeze",
          ja: "陽だまりの王国ブリーズ",
          ko: "화창한 왕국의 산들바람",
          es: "Brisa Soleada del Reino",
          fr: "Brise Ensoleillée du Royaume"
        },
        category: "wishes",
        resolution: "1920 × 1080 • HD",
        accent: ["#FFBE0B", "#FB5607", "#00F5D4"],
        imageUrl: "https://placehold.co/1920x1080/f59e0b/ffffff?text=Sunny+Kingdom+Breeze",
        fallbackUrl: "https://placehold.co/1920x1080/f59e0b/ffffff?text=Sunny+Kingdom+Breeze"
      }
    ];

    // App State
    const state = {
      lang: detectDeviceLanguage(),
      category: "all",
      search: "",
      activeBgId: WALLPAPERS[0].id,
      hueOffset: 0,
      modalWallpaperId: null,
      toastTimer: null
    };

    /**
     * Detect user's device language via navigator.languages / navigator.language
     */
    function detectDeviceLanguage() {
      const candidates = Array.isArray(navigator.languages) && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];

      for (const raw of candidates) {
        const code = String(raw).toLowerCase();
        if (code.startsWith("vi")) return "vi";
        if (code.startsWith("ja")) return "ja";
        if (code.startsWith("ko")) return "ko";
        if (code.startsWith("es")) return "es";
        if (code.startsWith("fr")) return "fr";
        if (code.startsWith("en")) return "en";
      }
      return "en";
    }

    function t() {
      return TRANSLATIONS[state.lang] || TRANSLATIONS.en;
    }

    function showToast(message) {
      const banner = document.getElementById("toast-banner");
      const textEl = document.getElementById("toast-message");
      textEl.textContent = message;

      banner.classList.remove("translate-y-24", "opacity-0");
      banner.classList.add("translate-y-0", "opacity-100");

      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        banner.classList.remove("translate-y-0", "opacity-100");
        banner.classList.add("translate-y-24", "opacity-0");
      }, 2800);
    }

    /**
     * Generates a rich artwork on a canvas if external image is unavailable or blocked by CORS
     * so downloading always produces a crisp PNG file.
     */
    function createFallbackCanvasDataUrl(wallpaper) {
      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 900;
      const ctx = canvas.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, wallpaper.accent[0] || "#FF4D8D");
      grad.addColorStop(0.5, wallpaper.accent[1] || "#4CC9F0");
      grad.addColorStop(1, wallpaper.accent[2] || "#FFBE0B");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Rainbow arcs
      const colors = ["#FF4D8D", "#FF9E00", "#FFBE0B", "#00F5D4", "#4CC9F0", "#9B5DE5"];
      colors.forEach((col, idx) => {
        ctx.beginPath();
        ctx.arc(canvas.width * 0.5, canvas.height * 0.95, 520 - idx * 28, Math.PI, 0);
        ctx.lineWidth = 24;
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.55;
        ctx.stroke();
      });

      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(15, 23, 42, 0.45)";
      ctx.fillRect(0, canvas.height - 170, canvas.width, 170);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 46px 'Fredoka', sans-serif";
      ctx.fillText(wallpaper.title[state.lang] || wallpaper.title.en, 64, canvas.height - 95);

      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.font = "600 24px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText(`True & Rainbow Kingdom • ${wallpaper.resolution}`, 64, canvas.height - 48);

      return canvas.toDataURL("image/png");
    }

    const MEDIAFIRE_FOLDER_URL = "https://www.mediafire.com/folder/wdifhzdfpcc2e/True_and_rainbow_kingdom(lazy_change_the_name_file)";

    /**
     * Triggers a clean download for a wallpaper item.
     */
    async function downloadWallpaper(wallpaper, externalUrl = "") {
      if (externalUrl) {
        const win = window.open(externalUrl, "_blank", "noopener,noreferrer");
        if (!win) {
          triggerAnchorDownload(externalUrl, "True_and_rainbow_kingdom.zip");
        }
        const title = wallpaper.title[state.lang] || wallpaper.title.en;
        showToast(`${t().toastDownloaded}${title}`);
        return;
      }

      const title = wallpaper.title[state.lang] || wallpaper.title.en;
      const safeName = `${wallpaper.id}-${state.lang}.png`;

      try {
        // Attempt direct fetch first (works for same-origin / local files)
        const response = await fetch(wallpaper.imageUrl, { cache: "no-store" });
        if (!response.ok) throw new Error("Network response not ok");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        triggerAnchorDownload(url, safeName);
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      } catch (_err) {
        // Fallback: render onto canvas and export PNG
        const dataUrl = createFallbackCanvasDataUrl(wallpaper);
        triggerAnchorDownload(dataUrl, safeName);
      }

      showToast(`${t().toastDownloaded}${title}`);
    }

    function triggerAnchorDownload(href, filename) {
      const link = document.createElement("a");
      link.href = href;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /**
     * Sets a wallpaper as the dynamic background behind the entire website.
     */
    function setAsWebsiteBackground(wallpaper, notify = true) {
      state.activeBgId = wallpaper.id;
      const wrapper = document.getElementById("bg-image-wrapper");
      const testImg = new Image();

      testImg.onload = () => {
        wrapper.style.backgroundImage = `url('${wallpaper.imageUrl}')`;
      };
      testImg.onerror = () => {
        wrapper.style.backgroundImage = `url('${wallpaper.fallbackUrl}')`;
      };
      testImg.src = wallpaper.imageUrl;

      if (notify) {
        const title = wallpaper.title[state.lang] || wallpaper.title.en;
        showToast(`${t().toastBgChanged}${title}`);
      }
    }

    function applyLanguageUI() {
      const dict = t();
      document.documentElement.lang = state.lang;

      document.getElementById("hero-pill").textContent = dict.heroPill;
      document.getElementById("hero-title").textContent = dict.heroTitle;
      document.getElementById("hero-desc").textContent = dict.heroDesc;
      document.getElementById("hero-cta-text").textContent = dict.heroCta;
      document.getElementById("modal-download-label").textContent = dict.downloadModal;

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        const isActive = btn.dataset.lang === state.lang;
        btn.classList.toggle("bg-gradient-to-r", isActive);
        btn.classList.toggle("from-pink-500", isActive);
        btn.classList.toggle("to-cyan-400", isActive);
        btn.classList.toggle("text-slate-950", isActive);
        btn.classList.toggle("shadow-md", isActive);
        btn.classList.toggle("text-white/80", !isActive);
        btn.classList.toggle("hover:bg-white/10", !isActive);
      });

      if (state.modalWallpaperId) {
        openModal(state.modalWallpaperId);
      }
    }

    function openModal(wallpaperId) {
      const wp = WALLPAPERS.find((item) => item.id === wallpaperId);
      if (!wp) return;

      state.modalWallpaperId = wp.id;
      const modal = document.getElementById("preview-modal");
      const img = document.getElementById("modal-image");

      document.getElementById("modal-title").textContent = wp.title[state.lang] || wp.title.en;
      document.getElementById("modal-meta").textContent = wp.resolution;
      img.src = wp.imageUrl;
      img.alt = wp.title[state.lang] || wp.title.en;
      img.onerror = () => {
        if (img.src !== wp.fallbackUrl) img.src = wp.fallbackUrl;
      };

      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      state.modalWallpaperId = null;
      const modal = document.getElementById("preview-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function setupDynamicMotion() {
      // Dynamic orbs remain active for smooth color ambiance
    }

    function bindEvents() {
      document.getElementById("hero-download-featured").addEventListener("click", () => {
        downloadWallpaper(WALLPAPERS[0], MEDIAFIRE_FOLDER_URL);
      });

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.lang = btn.dataset.lang;
          applyLanguageUI();
        });
      });

      document.getElementById("modal-close").addEventListener("click", closeModal);
      document.getElementById("preview-modal").addEventListener("click", (e) => {
        if (e.target.id === "preview-modal") closeModal();
      });

      document.getElementById("modal-download").addEventListener("click", () => {
        const wp = WALLPAPERS.find((w) => w.id === state.modalWallpaperId);
        if (wp) downloadWallpaper(wp);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      bindEvents();
      setupDynamicMotion();
      applyLanguageUI();
    });
  </script>
</body>
</html>
